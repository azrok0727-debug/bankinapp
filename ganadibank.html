<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>가나디은행</title>
<style>
:root{--bg:#0f1626;--card:#1a2640;--border:rgba(255,255,255,.08);--text1:#fff;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.35);--green:#10b981;--red:#ef4444;--purple:#a855f7;--orange:#f97316;--green-bg:rgba(16,185,129,.1);--red-bg:rgba(239,68,68,.1);--purple-bg:rgba(168,85,247,.1);--orange-bg:rgba(249,115,22,.1);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text1);font-family:'Pretendard',-apple-system,sans-serif;}
body{min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:calc(80px + env(safe-area-inset-bottom));}
.head{padding:18px 20px;display:flex;gap:10px;align-items:center;position:relative;z-index:9;}
.logo{width:36px;height:36px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;}
.brand{display:flex;flex-direction:column;gap:1px;}
.brand-sub{font-size:10px;color:var(--text3);letter-spacing:1.5px;font-weight:600;}
.brand-name{font-size:15px;font-weight:700;}
.page-wrap{padding:20px;max-width:600px;margin:0 auto;}
.section-title{font-size:18px;font-weight:800;margin:0;}
.section-title2{font-size:16px;font-weight:700;margin:0;}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.acc-card{background:linear-gradient(135deg,#1a2f6e 0%,#2a4fa8 50%,#1e3a8a 100%);border-radius:20px;padding:22px;margin-bottom:20px;position:relative;overflow:hidden;}
.acc-card::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);}
.acc-balance{font-size:32px;font-weight:900;letter-spacing:-1px;margin-top:8px;position:relative;z-index:1;}
.acc-balance-label{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:6px;position:relative;z-index:1;}
.acc-badge{font-size:10px;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:8px;display:inline-block;margin-top:10px;position:relative;z-index:1;}
.acc-badge.red{background:rgba(239,68,68,.15);color:#fca5a5;}
/* tx */
.tx-list{padding:0;display:flex;flex-direction:column;gap:8px;}
.tx-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;}
.tx-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tx-icon.send{background:var(--red-bg);}.tx-icon.recv{background:var(--green-bg);}
.tx-icon.interest{background:var(--green-bg);}.tx-icon.loan-out{background:var(--purple-bg);}
.tx-icon.loan-pay{background:var(--orange-bg);}.tx-icon.coupon-buy{background:rgba(186,85,211,.1);}
.tx-icon.coupon-resell{background:rgba(251,146,60,.1);}
.tx-info{flex:1;}
.tx-name{font-size:14px;font-weight:600;}
.tx-date{font-size:12px;color:var(--text3);margin-top:2px;}
.tx-amount{font-size:15px;font-weight:700;}
.tx-amount.send{color:var(--red);}.tx-amount.recv{color:var(--green);}
.tx-amount.interest{color:var(--green);}.tx-amount.loan-out{color:var(--purple);}
.tx-amount.loan-pay{color:var(--orange);}.tx-amount.coupon-buy{color:#b78de8;}
.tx-amount.coupon-resell{color:#fb923c;}
.empty-tx{text-align:center;padding:32px;color:var(--text3);font-size:14px;}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,22,38,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:50;}
.tab{flex:1;background:none;border:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text3);cursor:pointer;}
.tab.active{color:#3b82f6;}
.tab-icon{font-size:18px;}
.tab-label{font-size:11px;font-weight:600;}
</style>
</head>
<body>

<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, set }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FB = {
  apiKey:"AIzaSyDEGBu8sFChEdtnQEEC1FFZaAIwUr9fWpc",
  authDomain:"stock-c985f.firebaseapp.com",
  databaseURL:"https://stock-c985f-default-rtdb.firebaseio.com",
  projectId:"stock-c985f",
  storageBucket:"stock-c985f.firebasestorage.app",
  messagingSenderId:"1082843629086",
  appId:"1:1082843629086:web:58c6b2ca396cb7842d100f"
};

const db = getDatabase(initializeApp(FB));
const WEEK_MS = 7*24*3600*1000;

const GROUPS = [
  {id:1,name:'1모둠',members:['주시연','김지성','신재은','서은수']},
  {id:2,name:'2모둠',members:['강민채','권용민','이다영','김준우']},
  {id:3,name:'3모둠',members:['박준서','조혜원','김주이','윤지환']},
  {id:4,name:'4모둠',members:['최효민','정서윤','이세은','이강민']},
  {id:5,name:'5모둠',members:['김지원','임승언','이서준','김수현','이윤아']},
  {id:6,name:'6모둠',members:['이주호','민나진','최상윤','황세현','이수빈']},
];
const ALL_STUDENTS = GROUPS.flatMap(g=>g.members.map(m=>({name:m,group:g.id})));

let currentUser = localStorage.getItem('ganadi_bank_user');
let activeTab = 'home';
let fbState = null;

const $app = document.getElementById('app');
const fmt = n => Number(n||0).toLocaleString('ko-KR');
const fmtDate = ts => {
  const d = new Date(ts);
  const now = Date.now();
  const diff = now - ts;
  if(diff < 3600000) return `${Math.round(diff/60000)}분 전`;
  if(diff < 86400000) return `${Math.round(diff/3600000)}시간 전`;
  return (d.getMonth()+1)+'/'+d.getDate();
};

onValue(ref(db,'state'), snap=>{
  fbState = snap.val() || {};
  if(!fbState.students) fbState.students = {};
  if(!fbState.bankHistory) fbState.bankHistory = {};
  if(!fbState.bankInterest) fbState.bankInterest = {};
  if(!fbState.bankLoans) fbState.bankLoans = {};
  render();
});

function render(){
  if(!fbState){
    $app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--text2);">가나디 서버 연결 중...</div>`;
    return;
  }
  if(!currentUser){
    renderLogin();
    return;
  }
  renderMain();
}

function renderLogin(){
  $app.innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:24px;padding:30px 24px;width:100%;max-width:420px;">
        <div style="width:60px;height:60px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:16px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;">은</div>
        <h1 style="font-size:22px;font-weight:800;text-align:center;margin:0 0 6px;">가나디 은행</h1>
        <p style="font-size:13px;color:var(--text3);text-align:center;margin:0 0 22px;">학생을 선택해 로그인</p>
        ${GROUPS.map(g=>`
          <div style="margin-bottom:12px;">
            <div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:6px;">${g.name}</div>
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;">
              ${g.members.map(m=>`
                <button onclick="this.parentElement.parentElement.parentElement.parentElement.dispatchEvent(new CustomEvent('login',{detail:'${m}'}))" 
                  style="padding:11px 8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text1);font-size:13px;font-weight:600;cursor:pointer;">${m}</button>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  $app.addEventListener('login', e=>{
    currentUser = e.detail;
    localStorage.setItem('ganadi_bank_user', currentUser);
    render();
  });
}

function renderMain(){
  const balance = fbState?.students?.[currentUser]?.deposit ?? 0;
  const L = fbState?.bankLoans?.[currentUser];
  const loanBadge = L && L.remaining > 0 ? `<div class="acc-badge red" style="margin-left:8px;">⚠️ 대출 잔액 ${fmt(L.remaining)}점</div>` : '';
  
  // Get transaction history (including coupon transactions)
  const hist = (fbState?.bankHistory?.[currentUser] ?? []);
  const sorted = [...hist].sort((a,b)=>b.ts-a.ts).slice(0,12);
  
  const txHtml = sorted.length === 0 ? `<div class="empty-tx">📭 아직 거래 내역이 없어요</div>`
    : sorted.map(h=>{
      if(h.type==='send') return txRow('send','↑',`${h.to}에게 송금`,h.ts,`-${fmt(h.amount)}점`);
      if(h.type==='recv') return txRow('recv','↓',`${h.from}에게서 받음`,h.ts,`+${fmt(h.amount)}점`);
      if(h.type==='interest') return txRow('interest','💰',`예금 이자 (+${h.weeks}주)`,h.ts,`+${fmt(h.amount)}점`);
      if(h.type==='loan-receive') return txRow('loan-out','🏛',`대출 실행 (${h.weeks}주)`,h.ts,`+${fmt(h.amount)}점`);
      if(h.type==='loan-payment') return txRow('loan-pay','📤',`대출 상환 ${h.weekNo}회차`,h.ts,`-${fmt(h.amount)}점`);
      if(h.type==='loan-complete') return txRow('recv','✅','대출 완납 🎉',h.ts,'');
      if(h.type==='coupon-buy') return txRow('coupon-buy','🛍️',`쿠폰 구매: ${h.productName}`,h.ts,`-${fmt(h.amount)}점`);
      if(h.type==='coupon-resell-buy') return txRow('coupon-resell','🔄',`리셀 구매: ${h.productName} (${h.fromStudent}에게)`,h.ts,`-${fmt(h.amount)}점`);
      if(h.type==='coupon-resell-sell') return txRow('coupon-resell','🔄',`리셀 판매: ${h.productName} (${h.toStudent}에게)`,h.ts,`+${fmt(h.amount)}점`);
      return '';
    }).join('');

  $app.innerHTML = `
    <div class="head">
      <div class="logo">은</div>
      <div class="brand">
        <div class="brand-sub">GANADI BANK</div>
        <div class="brand-name">${currentUser}</div>
      </div>
    </div>

    <div class="page-wrap">
      <div class="acc-card">
        <div class="acc-balance-label">💳 현재 잔액</div>
        <div class="acc-balance">${fmt(balance)}<span style="font-size:13px;opacity:.7;margin-left:4px;">점</span></div>
        ${loanBadge}
      </div>

      <div class="section-head">
        <div class="section-title2">최근 거래내역</div>
      </div>
      <div class="tx-list">${txHtml}</div>
    </div>

    <div class="tabbar">
      <button class="tab ${activeTab==='home'?'active':''}" onclick="window.location.reload();">
        <div class="tab-icon">🏠</div><div class="tab-label">계좌</div>
      </button>
      <button class="tab ${activeTab==='transfer'?'active':''}" onclick="alert('개발 중입니다')">
        <div class="tab-icon">➡️</div><div class="tab-label">송금</div>
      </button>
      <button class="tab" onclick="localStorage.removeItem('ganadi_bank_user');window.location.reload();">
        <div class="tab-icon">🚪</div><div class="tab-label">로그아웃</div>
      </button>
    </div>
  `;
}

function txRow(type, icon, label, ts, amt){
  return `<div class="tx-item"><div class="tx-icon ${type}">${icon}</div><div class="tx-info"><div class="tx-name">${label}</div><div class="tx-date">${fmtDate(ts)}</div></div><div class="tx-amount ${type}">${amt}</div></div>`;
}

render();
</script>
</body>
</html>
