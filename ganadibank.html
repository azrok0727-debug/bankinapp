<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가나디뱅크</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가나디뱅크">
<meta name="theme-color" content="#0a0f1e">
<link rel="manifest" href="./manifest-bank.json">
<link rel="apple-touch-icon" href="./icon-bank-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0f1e;--bg2:#111827;--bg3:#1c2640;--bg4:#232d47;--card:#151e33;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0f4ff;--text2:#8a9bbf;--text3:#4a5878;
  --accent:#4f80ff;--accent2:#7c9fff;
  --green:#22d4a0;--green-bg:rgba(34,212,160,0.1);
  --red:#ff5e7a;--red-bg:rgba(255,94,122,0.1);
  --orange:#ff9a3c;--orange-bg:rgba(255,154,60,0.1);
  --gold:#f5c842;--purple:#a78bfa;--purple-bg:rgba(167,139,250,0.1);
  --radius:14px;--radius-lg:20px;--shadow:0 8px 32px rgba(0,0,0,0.4);
  --font:'Pretendard',-apple-system,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);}
body{overflow-x:hidden;}::-webkit-scrollbar{width:0;}

/* splash */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
#splash.fade-out{animation:splashOut 0.5s ease forwards;}
@keyframes splashOut{to{opacity:0;pointer-events:none;}}
.splash-logo{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#2a3f8a,#4f80ff);display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 0 40px rgba(79,128,255,0.4);animation:logoFloat 2s ease infinite alternate;}
@keyframes logoFloat{from{transform:translateY(0);}to{transform:translateY(-6px);}}
.splash-name{font-size:26px;font-weight:800;}.splash-name span{color:var(--accent);}
.splash-dots{display:flex;gap:6px;}
.splash-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0.3;animation:dotPulse 1.2s ease infinite;}
.splash-dot:nth-child(2){animation-delay:.2s;}.splash-dot:nth-child(3){animation-delay:.4s;}
@keyframes dotPulse{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:1;transform:scale(1.3);}}

/* layout */
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;}
.header-logo{display:flex;align-items:center;gap:10px;}
.header-logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2a3f8a,#4f80ff);display:flex;align-items:center;justify-content:center;font-size:18px;}
.header-logo-text{font-size:18px;font-weight:800;}.header-logo-text span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:10px;}
.badge-bank{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(79,128,255,0.15);color:var(--accent2);border:1px solid rgba(79,128,255,0.3);}
.logout-btn-top{background:none;border:1px solid var(--border2);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer;font-family:var(--font);}
#main-content{flex:1;overflow-y:auto;padding-bottom:100px;}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:32px 28px;box-shadow:var(--shadow);}
.login-bank-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#1a2f6e,#4f80ff);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;box-shadow:0 0 24px rgba(79,128,255,0.3);}
.login-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px;}
.login-subtitle{font-size:13px;color:var(--text2);text-align:center;margin-bottom:28px;}
.login-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;display:block;}
.login-select{width:100%;padding:14px 16px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:15px;font-family:var(--font);margin-bottom:16px;outline:none;}
.login-select:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:16px;background:linear-gradient(135deg,#3a6aff,#4f80ff);border:none;border-radius:var(--radius);color:white;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);box-shadow:0 4px 20px rgba(79,128,255,0.35);}

/* account card */
.account-section{padding:20px 20px 0;}
.account-card{background:linear-gradient(135deg,#1a2f6e 0%,#2a4fa8 50%,#1e3a8a 100%);border-radius:var(--radius-lg);padding:24px;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.account-card::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.04);}
.account-card::after{content:'';position:absolute;bottom:-60px;left:-30px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.03);}
.acc-type{font-size:12px;font-weight:600;color:rgba(255,255,255,0.6);letter-spacing:1px;margin-bottom:6px;}
.acc-name{font-size:18px;font-weight:700;color:white;margin-bottom:20px;}
.acc-balance-label{font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:6px;}
.acc-balance{font-size:34px;font-weight:900;color:white;letter-spacing:-1px;line-height:1;position:relative;z-index:1;}
.acc-balance span{font-size:16px;font-weight:600;opacity:.7;margin-left:4px;}
.acc-badge{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;position:relative;z-index:1;}
.acc-badge.green{background:rgba(34,212,160,0.15);border:1px solid rgba(34,212,160,0.3);color:var(--green);}
.acc-badge.red{background:rgba(255,94,122,0.12);border:1px solid rgba(255,94,122,0.3);color:var(--red);}

/* quick menu */
.quick-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 20px;}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all 0.2s;font-family:var(--font);}
.quick-btn:hover{border-color:var(--accent);background:var(--bg3);transform:translateY(-2px);}
.quick-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.quick-icon.blue{background:rgba(79,128,255,0.15);}
.quick-icon.green{background:rgba(34,212,160,0.12);}
.quick-icon.gold{background:rgba(245,200,66,0.12);}
.quick-icon.red{background:rgba(255,94,122,0.12);}
.quick-label{font-size:12px;font-weight:600;color:var(--text);}

/* 계좌 슬라이더 */
.accounts-slider{display:flex;gap:12px;padding:20px 20px 0;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.accounts-slider::-webkit-scrollbar{display:none;}
.account-card{min-width:calc(100% - 40px);scroll-snap-align:start;background:linear-gradient(135deg,#1a2f6e 0%,#2a4fa8 50%,#1e3a8a 100%);border-radius:var(--radius-lg);padding:24px;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.4);flex-shrink:0;}
.account-card.coupon{background:linear-gradient(135deg,#1a3a2a 0%,#1e6644 50%,#0d4a2e 100%);}
.account-card.stock{background:linear-gradient(135deg,#2a1a4a 0%,#4a2a8a 50%,#1e0a5a 100%);}
.account-card::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.04);}
.account-card::after{content:'';position:absolute;bottom:-60px;left:-30px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.03);}
.acc-type{font-size:12px;font-weight:600;color:rgba(255,255,255,0.6);letter-spacing:1px;margin-bottom:6px;}
.acc-name{font-size:18px;font-weight:700;color:white;margin-bottom:20px;}
.acc-balance-label{font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:6px;}
.acc-balance{font-size:34px;font-weight:900;color:white;letter-spacing:-1px;line-height:1;position:relative;z-index:1;}
.acc-balance span{font-size:16px;font-weight:600;opacity:.7;margin-left:4px;}
.acc-badge{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;position:relative;z-index:1;}
.acc-badge.green{background:rgba(34,212,160,0.15);border:1px solid rgba(34,212,160,0.3);color:var(--green);}
.acc-badge.red{background:rgba(255,94,122,0.12);border:1px solid rgba(255,94,122,0.3);color:var(--red);}
.acc-badge.yellow{background:rgba(245,200,66,0.15);border:1px solid rgba(245,200,66,0.3);color:var(--gold);}
.acc-badge.purple{background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.3);color:var(--purple);}
.acc-dots{display:flex;gap:6px;justify-content:center;padding:10px 0 0;}
.acc-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);transition:all .2s;}
.acc-dot.active{background:white;width:18px;border-radius:3px;}
/* 주식 상세 */
.stock-list{display:flex;flex-direction:column;gap:8px;}
.stock-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
.stock-ticker{font-size:13px;font-weight:800;color:var(--accent);width:48px;flex-shrink:0;}
.stock-info{flex:1;}
.stock-name{font-size:13px;font-weight:600;}
.stock-qty{font-size:12px;color:var(--text3);margin-top:2px;}
.stock-val{text-align:right;}
.stock-price{font-size:14px;font-weight:700;}
.stock-change{font-size:11px;color:var(--text3);}
/* bottom nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border2);display:flex;padding:0 6px;padding-bottom:env(safe-area-inset-bottom,0);z-index:100;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;background:none;border:none;cursor:pointer;font-family:var(--font);gap:4px;}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{font-size:10px;font-weight:600;color:var(--text3);}
.nav-btn.active .nav-label{color:var(--accent);}
.nav-btn.active .nav-icon{filter:drop-shadow(0 0 4px rgba(79,128,255,0.6));}

/* page */
.page-wrap{padding:20px;display:flex;flex-direction:column;gap:16px;}
.page-title{font-size:22px;font-weight:800;}
.page-sub{font-size:14px;color:var(--text2);margin-top:4px;}
.form-label{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.3px;margin-bottom:8px;display:block;}
.form-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;}
.form-section{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:18px;}

/* tx */
.tx-list{padding:0 20px;display:flex;flex-direction:column;gap:8px;}
.tx-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
.tx-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.tx-icon.send{background:var(--red-bg);}.tx-icon.recv{background:var(--green-bg);}
.tx-icon.interest{background:var(--green-bg);}.tx-icon.loan-out{background:var(--purple-bg);}
.tx-icon.loan-pay{background:var(--orange-bg);}
.tx-info{flex:1;}.tx-name{font-size:14px;font-weight:600;}.tx-date{font-size:12px;color:var(--text3);margin-top:2px;}
.tx-amount{font-size:15px;font-weight:700;}
.tx-amount.send{color:var(--red);}.tx-amount.recv{color:var(--green);}
.tx-amount.interest{color:var(--green);}.tx-amount.loan-out{color:var(--purple);}
.tx-amount.loan-pay{color:var(--orange);}
.empty-tx{text-align:center;padding:32px;color:var(--text3);font-size:14px;}

/* section head */
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:12px;}
.section-title2{font-size:15px;font-weight:700;}

/* interest card */
.interest-card{background:linear-gradient(135deg,#0d2e1f,#0d3d2a);border:1px solid rgba(34,212,160,.25);border-radius:var(--radius-lg);padding:22px;position:relative;overflow:hidden;}
.interest-card::before{content:'';position:absolute;top:-30px;right:-30px;width:140px;height:140px;border-radius:50%;background:rgba(34,212,160,0.06);}
.interest-rate-big{font-size:40px;font-weight:900;color:var(--green);letter-spacing:-1px;}
.interest-rate-big span{font-size:18px;font-weight:600;opacity:.7;}
.irow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:14px;}
.irow:last-child{border-bottom:none;}
.irow-label{color:var(--text2);}.irow-value{font-weight:700;}
.next-bar-wrap{margin-top:14px;background:rgba(255,255,255,0.06);border-radius:6px;height:6px;overflow:hidden;}
.next-bar-fill{height:100%;background:linear-gradient(90deg,#22d4a0,#4f80ff);border-radius:6px;transition:width .5s ease;}

/* loan */
.loan-card{background:linear-gradient(135deg,#2a0f1e,#3d1a2a);border:1px solid rgba(255,94,122,.25);border-radius:var(--radius-lg);padding:22px;position:relative;overflow:hidden;}
.loan-card::before{content:'';position:absolute;top:-30px;right:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,94,122,0.05);}
.loan-big{font-size:34px;font-weight:900;color:var(--red);letter-spacing:-1px;}
.loan-big span{font-size:16px;font-weight:600;opacity:.7;}

/* rate steps */
.rate-steps{display:flex;flex-direction:column;gap:8px;}
.rate-step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);}
.rate-step.active{border-color:rgba(79,128,255,.4);background:rgba(79,128,255,0.06);}
.rate-bar{width:5px;height:36px;border-radius:3px;flex-shrink:0;}
.rate-info{flex:1;}.rate-range{font-size:12px;color:var(--text2);}.rate-val{font-size:16px;font-weight:800;margin-top:2px;}
.rate-tag{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:700;}

/* repay options */
.repay-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.repay-option{padding:16px;border:2px solid var(--border2);border-radius:var(--radius);cursor:pointer;transition:all .15s;background:var(--bg3);}
.repay-option:hover{border-color:rgba(79,128,255,.4);}
.repay-option.selected{border-color:var(--accent);background:rgba(79,128,255,0.08);}
.repay-icon{font-size:24px;margin-bottom:8px;}
.repay-name{font-size:13px;font-weight:700;margin-bottom:4px;}
.repay-desc{font-size:11px;color:var(--text3);line-height:1.5;}

/* schedule */
.schedule-table{width:100%;border-collapse:collapse;font-size:13px;}
.schedule-table th{padding:10px 8px;text-align:left;color:var(--text3);font-weight:600;border-bottom:1px solid var(--border2);font-size:11px;letter-spacing:.3px;}
.schedule-table td{padding:10px 8px;border-bottom:1px solid var(--border);font-weight:500;}
.schedule-table tr:last-child td{border-bottom:none;}
.schedule-table .final-row td{color:var(--orange);font-weight:700;}

/* sub tabs */
.sub-tabs{display:flex;gap:8px;padding:0 20px;margin-bottom:16px;}
.sub-tab{flex:1;padding:10px;border:1px solid var(--border2);border-radius:12px;background:transparent;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);text-align:center;transition:all .15s;}
.sub-tab.active{background:var(--accent);border-color:var(--accent);color:white;box-shadow:0 2px 12px rgba(79,128,255,.35);}

/* info boxes */
.info-box{padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.7;display:flex;gap:10px;}
.info-box.blue{background:rgba(79,128,255,0.08);border:1px solid rgba(79,128,255,.2);color:var(--accent2);}
.info-box.green{background:rgba(34,212,160,0.07);border:1px solid rgba(34,212,160,.2);color:#22d4a0;}
.info-box.red{background:rgba(255,94,122,0.08);border:1px solid rgba(255,94,122,.2);color:var(--red);}
.info-box.orange{background:rgba(255,154,60,0.08);border:1px solid rgba(255,154,60,.2);color:var(--orange);}

/* input */
.amount-input-wrap{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:20px;}
.amount-input{width:100%;background:none;border:none;font-size:36px;font-weight:900;color:var(--text);font-family:var(--font);outline:none;letter-spacing:-1px;}
.amount-input::placeholder{color:var(--text3);}
.amount-unit{font-size:16px;font-weight:600;color:var(--text2);}
.amount-avail{font-size:13px;color:var(--text3);margin-top:6px;}
.amount-avail strong{color:var(--green);}
.quick-amounts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.qa-btn{padding:7px 14px;border-radius:20px;background:var(--bg3);border:1px solid var(--border2);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;font-family:var(--font);}
.qa-btn:hover{border-color:var(--accent);color:var(--accent);}

/* recipient */
.recipient-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;}
.recipient-item:last-child{border-bottom:none;}
.recipient-item:hover{background:var(--bg3);}
.recipient-item.selected{background:rgba(79,128,255,0.08);border-left:3px solid var(--accent);}
.recv-avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white;flex-shrink:0;}
.recv-info{flex:1;}.recv-name{font-size:14px;font-weight:600;}.recv-group{font-size:12px;color:var(--text3);}
.recv-balance{font-size:13px;font-weight:600;color:var(--text2);}
.search-wrap{padding:12px 16px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);display:flex;align-items:center;gap:10px;}
.search-wrap input{flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--text);font-family:var(--font);}
.search-wrap input::placeholder{color:var(--text3);}

/* buttons */
.primary-btn{width:100%;padding:18px;background:linear-gradient(135deg,#3a6aff,#4f80ff);border:none;border-radius:var(--radius);color:white;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--font);box-shadow:0 4px 20px rgba(79,128,255,.35);}
.primary-btn:disabled{opacity:.35;cursor:not-allowed;}
.danger-btn{width:100%;padding:16px;background:linear-gradient(135deg,#c0334a,#ff5e7a);border:none;border-radius:var(--radius);color:white;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);box-shadow:0 4px 20px rgba(255,94,122,.3);}
.danger-btn:disabled{opacity:.35;cursor:not-allowed;}

/* weeks slider */
.weeks-slider{width:100%;accent-color:var(--accent);}
.weeks-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:6px;}

/* rank */
.rank-list{padding:0 20px;display:flex;flex-direction:column;gap:8px;}
.rank-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
.rank-item.me{border-color:rgba(79,128,255,.4);background:rgba(79,128,255,0.06);}
.rank-num{font-size:16px;font-weight:800;width:28px;text-align:center;}
.rank-num.gold{color:#f5c842;}.rank-num.silver{color:#b0bec5;}.rank-num.bronze{color:#cd7f32;}.rank-num.other{color:var(--text3);}
.rank-av{width:40px;height:40px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}

// ── 대출 이자율 ─────────────────────────────────────────
// ratio = 대출액 / 총자산  weeks = 1~4
function loanRate(ratio, weeks) {
  const base = ratio < .20 ? 5 : ratio < .40 ? 6 : 7;
  return +(base + (weeks-1)*0.5).toFixed(1);
}

// ── 상환 일정 ────────────────────────────────────────────
function calcSchedule(principal, ratePerWeek, weeks, type) {
  const r = ratePerWeek/100;
  const rows = [];
  if (type === 'equal') {
    // 원리금균등
    const pmt = Math.ceil(principal * r * Math.pow(1+r,weeks) / (Math.pow(1+r,weeks)-1));
    let bal = principal;
    for (let w=1; w<=weeks; w++) {
      const interest = Math.round(bal*r);
      const prin = Math.min(pmt - interest, bal);
      bal = Math.max(0, bal - prin);
      rows.push({week:w, interest, principal:prin, total:interest+prin, balance:bal, isFinal:w===weeks});
    }
  } else {
    // 만기일시
    const weeklyInt = Math.round(principal*r);
    for (let w=1; w<=weeks; w++) {
      const isFinal = w===weeks;
      rows.push({week:w, interest:weeklyInt, principal:isFinal?principal:0, total:weeklyInt+(isFinal?principal:0), balance:isFinal?0:principal, isFinal});
    }
  }
  return rows;
}

}

}

}

  const d=new Date(ts);

}

// ── 예금 이자 자동 지급 ───────────────────────────────────
async function checkInterest(){
  if(!currentUser||!fbState)return;
  const now=Date.now();
  const iData=fbState?.bankInterest?.[currentUser];
  // lastApplied가 없으면 지금 시각으로 초기화 (첫 로그인 시 이자 폭발 방지)
  if(!iData?.lastApplied){
    await update(ref(db,`state/bankInterest/${currentUser}`),{lastApplied:now,totalEarned:0});
    return;
  }
  const last=iData.lastApplied;
  // 최대 4주(1달)까지만 소급 적용
  const passed=Math.min(Math.floor((now-last)/WEEK_MS), 4);
  if(passed<1)return;
  const d=dep(currentUser);
  if(d<=0)return;
  const earned=Math.round(d*(Math.pow(1+DEP_RATE,passed)-1)*100)/100;
  if(earned<0.5)return;
  try{
    await runTransaction(ref(db,`state/students/${currentUser}`),cur=>{
      if(!cur)return cur;
      cur.deposit=Math.round(((cur.deposit??0)+earned)*100)/100;
      return cur;
    });
    const newLast=last+passed*WEEK_MS;
    await update(ref(db,`state/bankInterest/${currentUser}`),{
      lastApplied:newLast,
      totalEarned:(iData.totalEarned??0)+earned
    });
    const hist=[...(fbState?.bankHistory?.[currentUser]??[]),
      {type:'interest',amount:Math.round(earned),weeks:passed,ts:now}];
    await runTransaction(ref(db,`state/bankHistory/${currentUser}`),()=>hist);
    showToast(`💰 예금 이자 +${fmt(earned)}점 지급!`,'success');
  }catch(e){}
}

window.confirmLoan=async function(){
  closeModal();
  const tot=totalAsset(currentUser);
  const rate=loanRate(loanAmt/tot,loanWeeks);
  const now=Date.now();
  try{
    const snap=await get(ref(db,`state/students/${currentUser}`));
    const stu=snap.val();
    if(!stu)return showToast('오류가 발생했습니다','error');
    const newDeposit=Math.round(((stu.deposit??0)+loanAmt)*100)/100;
    const hist=[...(fbState?.bankHistory?.[currentUser]??[]),
      {type:'loan-receive',amount:loanAmt,weeks:loanWeeks,rate,ts:now}];
    // 한 번의 update()로 deposit + 대출정보 + 거래내역 동시 반영
    await update(ref(db),{
      [`state/students/${currentUser}/deposit`]: newDeposit,
      [`state/bankLoans/${currentUser}`]: {
        principal:loanAmt,remaining:loanAmt,ratePercent:rate,
        totalWeeks:loanWeeks,paidWeeks:0,repayType:loanType,
        startedAt:now,lastCharged:now
      },
      [`state/bankHistory/${currentUser}`]: hist,
    });
    showToast(`🏛 ${fmt(loanAmt)}점 대출 완료!`,'success');
    loanAmt=0;loanSubTab='apply';switchTab('loan');
  }catch(e){showToast('오류가 발생했습니다','error');}
};

window.confirmRepay=async function(){
  closeModal();
  const L=loan(currentUser);if(!L)return;
  const sched=calcSchedule(L.principal,L.ratePercent,L.totalWeeks,L.repayType);
  const row=sched[L.paidWeeks];if(!row)return;
  const d=dep(currentUser);
  if(d<row.total)return showToast('예금이 부족합니다','error');
  const now=Date.now();
  const newPaid=L.paidWeeks+1;
  const newRem=Math.max(0,L.remaining-row.principal);
  const done=newPaid>=L.totalWeeks||newRem<=0;
  try{
    const snap=await get(ref(db,`state/students/${currentUser}`));
    const stu=snap.val();
    if(!stu)return showToast('오류가 발생했습니다','error');
    const newDeposit=Math.round(((stu.deposit??0)-row.total)*100)/100;
    const hist=[...(fbState?.bankHistory?.[currentUser]??[]),
      {type:'loan-payment',amount:row.total,weekNo:newPaid,ts:now}];
    if(done)hist.push({type:'loan-complete',ts:now});
    // 한 번의 update()로 deposit + 대출정보 + 거래내역 동시 반영
    await update(ref(db),{
      [`state/students/${currentUser}/deposit`]: newDeposit,
      [`state/bankLoans/${currentUser}/remaining`]: done?0:newRem,
      [`state/bankLoans/${currentUser}/paidWeeks`]: newPaid,
      [`state/bankLoans/${currentUser}/lastCharged`]: now,
      [`state/bankHistory/${currentUser}`]: hist,
    });
    showToast(done?'🎉 대출 완납! 고생했어요!':`✅ ${newPaid}회차 상환 완료`,'success');
    switchTab('loan');
  }catch(e){showToast('오류가 발생했습니다','error');}
};

// deposit Firebase 경로
function depPath(name){ return `state/students/${name}/deposit`; }
function depRef(name){ return ref(db, depPath(name)); }

window.confirmTransfer=async function(){
  closeModal();
  try{
    // 보내는 사람 예금 확인 및 차감
    let ok=false;
    await runTransaction(depRef(currentUser),cur=>{
      const d=cur??0;
      if(d<transferAmount)return; // abort
      ok=true;
      return Math.round((d-transferAmount)*100)/100;
    });
    if(!ok)return showToast('예금이 부족합니다','error');

    // 받는 사람 deposit 현재값 조회
    const ts=Date.now();
    const toSnap=await get(depRef(transferTarget));
    const toDep=toSnap.val()??0;
    const toDeposit=Math.round((toDep+transferAmount)*100)/100;

    const fromHist=[...(fbState?.bankHistory?.[currentUser]??[]),
      {type:'send',to:transferTarget,amount:transferAmount,ts}];
    const toHist=[...(fbState?.bankHistory?.[transferTarget]??[]),
      {type:'recv',from:currentUser,amount:transferAmount,ts}];

    await update(ref(db),{
      [depPath(transferTarget)]: toDeposit,
      [`state/bankHistory/${currentUser}`]: fromHist,
      [`state/bankHistory/${transferTarget}`]: toHist,
    });

    showToast(`✅ ${transferTarget}에게 ${fmt(transferAmount)}점 송금 완료!`,'success');
    transferTarget=null;transferAmount=0;switchTab('home');
  }catch(e){showToast('오류가 발생했습니다','error');}
};

  const updates={};
  const ts=Date.now();
  ALL_STUDENTS.forEach(s=>{
    const cur=fbState?.students?.[s.name]?.couponBalance??0;
    updates[`state/students/${s.name}/couponBalance`]=Math.round((cur+amount)*100)/100;
    const hist=[...(fbState?.bankHistory?.[s.name]??[]),{type:'coupon-grant',amount,ts}];
    updates[`state/bankHistory/${s.name}`]=hist;
  });
  await update(ref(db),updates);
  showToast(`전체 ${ALL_STUDENTS.length}명에게 ${fmt(amount)}점 지급 완료!`,'success');
  renderCouponGrant();
};

// ════════════════════════════════════
// 🏆 순위
// ════════════════════════════════════
function renderRanking(){
  const ranked=ALL_STUDENTS.map(s=>({name:s.name,group:s.group,deposit:dep(s.name)})).sort((a,b)=>b.deposit-a.deposit);
  const list=ranked.map((s,i)=>{
    const isMe=s.name===currentUser;
    const nc=i===0?'gold':i===1?'silver':i===2?'bronze':'other';
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
    const color=GC[s.group-1]||'#4f80ff';
    return `<div class="rank-item ${isMe?'me':''}">
      <div class="rank-num ${nc}">${medal}</div>
      <div class="rank-av" style="background:linear-gradient(135deg,#1e2a4a,${color})">${init(s.name)}</div>
      <div class="rank-info"><div class="rank-name">${s.name}${isMe?' <span class="rank-tag">나</span>':''}</div><div class="rank-group">${GN[s.group]}</div></div>
      <div class="rank-deposit">${fmt(s.deposit)}점</div>
    </div>`;
  }).join('');
  document.getElementById('main-content').innerHTML=`
    <div style="padding:20px 20px 12px;">
      <div class="page-title">🏆 예금 순위</div>
      <div class="page-sub" style="margin-top:4px;">예금 잔액 기준 랭킹이에요</div>
    </div>
    <div class="rank-list">${list}</div>`;
}

// ════════════════════════════════════
// 모달 / 토스트
// ════════════════════════════════════
function showModal(html){document.getElementById('modal-inner').innerHTML=html;document.getElementById('main-modal').classList.add('open');}
window.closeModal=()=>document.getElementById('main-modal').classList.remove('open');
document.getElementById('main-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
window.showToast=function(msg,type='info'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type} show`;
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200);
};
function showToast(msg,type){window.showToast(msg,type);}
</script>
